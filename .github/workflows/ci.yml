name: URL Monitor CI

on:
  push:
    paths:
      - "software/misc-projects/05_dockerized_url_monitor/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "software/misc-projects/05_dockerized_url_monitor/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/misc-projects/05_dockerized_url_monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover tests

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: software/misc-projects/05_dockerized_url_monitor
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t url-monitor:ci .
