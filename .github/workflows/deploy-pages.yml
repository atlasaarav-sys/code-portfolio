name: Deploy Portfolio Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "software/portfolio-website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # lets you manually trigger a redeploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: software/portfolio-website
      - id: deployment
        uses: actions/deploy-pages@v4
