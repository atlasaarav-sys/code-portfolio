{% extends "base.html" %}
{% block title %}My Bookmarks{% endblock %}
{% block content %}
  <h1>{{ username }}'s Bookmarks</h1>
  <form method="post" action="{{ url_for('logout') }}" class="inline">
    <button type="submit">Log out</button>
  </form>

  <h2>Add a bookmark</h2>
  <form method="post">
    <label>Title <input type="text" name="title" required></label>
    <label>URL <input type="url" name="url" placeholder="https://example.com" required></label>
    <button type="submit">Add</button>
  </form>

  <h2>Your bookmarks</h2>
  {% if bookmarks %}
    {% for bookmark in bookmarks %}
      <div class="bookmark">
        <a href="{{ bookmark.url }}" target="_blank" rel="noopener">{{ bookmark.title }}</a>
        <form method="post" action="{{ url_for('delete', bookmark_id=bookmark.id) }}" class="inline">
          <button type="submit">Delete</button>
        </form>
      </div>
    {% endfor %}
  {% else %}
    <p>No bookmarks yet.</p>
  {% endif %}
{% endblock %}
