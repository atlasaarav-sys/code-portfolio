<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Bookmarks{% endblock %}</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
    input { display: block; width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    .flash { background: #fee; border: 1px solid #f99; padding: 8px; border-radius: 4px; margin-bottom: 12px; }
    .bookmark { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
